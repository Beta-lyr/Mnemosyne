[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemosyne"
version = "0.1.0"
description = "Memory-driven open-source virtual companion agent framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "hshandyj" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=13.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # Redis
    "redis[hiredis]>=5.0.0",
    # LLM
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "litellm>=1.40.0",
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    # Embedding
    "sentence-transformers>=3.0.0",
    # Telegram
    "python-telegram-bot>=21.0",
    # Task scheduling
    "apscheduler>=3.10.0",
    # Image generation API
    "replicate>=0.30.0",
    "fal-client>=0.4.0",
    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
